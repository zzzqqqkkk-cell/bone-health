<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>公众号长图 · 拓展阅读</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:#070A0F}
body{color:#E9EFF4;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
.bar{position:sticky;top:0;z-index:9;display:flex;align-items:center;justify-content:space-between;
 padding:11px 14px;background:rgba(7,10,15,.96);
 border-bottom:1px solid rgba(255,255,255,.08);font-size:13px;color:#8A99A8}
.bar b{color:#E9EFF4;font-weight:600;font-size:13px}
.bar a{color:#00E5C0;text-decoration:none;font-size:13.5px;padding:4px 6px}
.notice{margin:0;padding:9px 14px;font-size:12px;line-height:1.62;color:#8FA3B4;
 background:rgba(0,229,192,.05);border-bottom:1px solid rgba(255,255,255,.06);
 border-left:3px solid rgba(0,229,192,.55)}
.notice b{color:#00E5C0;font-weight:600}
.wrap{padding:0 0 36px}
.wrap img{display:block;width:100%;height:auto;max-width:820px;margin:0 auto}
.backbig{display:block;margin:26px 20px 10px;padding:18px 20px;border-radius:14px;
 background:linear-gradient(180deg,#00E5C0,#00BFA2);color:#04120F;font-weight:700;font-size:17px;
 text-align:center;text-decoration:none;letter-spacing:.04em;
 box-shadow:0 8px 24px rgba(0,229,192,.28)}
.backbig:active{transform:translateY(1px)}
.backwrap{padding:0 0 40px}
.tip{text-align:center;font-size:11px;color:#4E6072;padding:9px 14px 22px;line-height:1.7}
.notfound{padding:60px 20px;text-align:center;color:#7E93A6;line-height:1.9}

@media (max-width:480px){
  .bar{padding:9px 12px;font-size:12px}
  .bar b{font-size:12.5px}
  .bar a{font-size:12.5px}
  .notice{padding:8px 12px;font-size:11px;line-height:1.6}
  .tip{font-size:10.5px;padding:8px 12px 20px}
  .backbig{margin:20px 14px 8px;padding:16px 14px;font-size:16px;border-radius:12px}
}
.mob .bar{padding:9px 12px;font-size:12px}
.mob .bar b{font-size:12.5px}
.mob .bar a{font-size:12.5px}
.mob .notice{padding:8px 12px;font-size:11px;line-height:1.6}
.mob .tip{font-size:10.5px;padding:8px 12px 20px}
.mob .backbig{margin:20px 14px 8px;padding:16px 14px;font-size:16px;border-radius:12px}
</style>
</head>
<body>
<div class="bar"><b>公众号长图</b><a id="back" href="../index.html">返回</a></div>
<div class="notice"><b>脱敏声明</b>　本页为公众号原文的完整长图。为保护个人信息，公众号名称、作者与审核人员署名、图片水印均已作模糊或裁切处理；正文内容未作删改。如需核验原文，可向大赛组委会提供对应公众号信息。</div>
<div class="wrap"><img id="shot" alt=""></div>
<div class="backwrap"><a class="backbig" id="backBig" href="../index.html">← 返回上一页</a></div>
<div class="tip">上下滑动查看全文 · 图片按屏幕宽度自适应<br>本页内容仅供健康科普参考，不构成诊疗建议</div>
<script>
(function(){
  var q = new URLSearchParams(location.search);
  var i = q.get('i');
  var back = q.get('back');
  var a = document.getElementById('back');
  if (back) a.setAttribute('href', back);
  else if (document.referrer) a.setAttribute('href', document.referrer);
  var big = document.getElementById('backBig');
  if (big) big.setAttribute('href', a.getAttribute('href'));
  // 同源有历史记录时走 history.back()，浏览器会还原原来的滚动位置
  function bindBack(el){
    if (!el) return;
    el.addEventListener('click', function(e){
      var sameOrigin = false;
      try {
        sameOrigin = document.referrer &&
                     new URL(document.referrer).origin === location.origin;
      } catch (err) { sameOrigin = false; }
      if (sameOrigin && history.length > 1) {
        e.preventDefault();
        history.back();
      }
    });
  }
  bindBack(a);
  bindBack(big);
  var img = document.getElementById('shot');
  if (!i || !/^\d{1,2}$/.test(i)) {
    img.remove();
    document.body.insertAdjacentHTML('beforeend',
      '<div class="notfound">缺少参数，请从拓展阅读卡片进入。</div>');
    return;
  }
  img.src = i + '.webp';
  img.alt = '公众号长图 ' + i;
  img.onerror = function(){
    this.remove();
    document.body.insertAdjacentHTML('beforeend','<div class="notfound">图片未找到。</div>');
  };
})();
</script>

<script>
(function(){
  // 不依赖媒体查询：按实际宽度加类，兼容某些内置浏览器
  function apply(){
    var w = Math.min(window.innerWidth, document.documentElement.clientWidth || 9999);
    document.documentElement.classList.toggle('mob', w <= 520);
  }
  apply();
  window.addEventListener('resize', apply);
})();
</script>
</body>
</html>
